<svg viewBox="0 0 1123 800" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','IBM Plex Mono','DejaVu Sans Mono',monospace">
  <defs>
    <marker id="aink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1C1C1A"/></marker>
    <marker id="aacc" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1E55C0"/></marker>
    <marker id="aopen" markerWidth="11" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1E55C0" stroke-width="1.4"/></marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#1E55C0"/></marker>
    <marker id="aloop" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L5 3 L0 6 z" fill="#1E55C0"/></marker>
  </defs>

  <rect x="0" y="0" width="1123" height="800" fill="#F6F4EE"/>

  <text x="44" y="62" font-size="25" font-weight="700" fill="#1C1C1A">MMG Solution Architecture</text>
  <text x="46" y="86" font-size="12" fill="#6B6960">AI on the existing landscape &#183; the shared base view for all three stakeholders</text>

  <rect x="892" y="44" width="14" height="14" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/>
  <text x="912" y="55" font-size="10" fill="#1C1C1A">existing / deterministic</text>
  <rect x="892" y="66" width="14" height="14" rx="3" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.5"/>
  <text x="912" y="77" font-size="10" fill="#1E55C0">AI-specific</text>

  <line x1="44" y1="100" x2="1079" y2="100" stroke="#D9D5CB" stroke-width="1"/>

  <!-- plane bands -->
  <rect x="44" y="112" width="1035" height="446" rx="6" fill="#FBFAF6" stroke="#E4E0D6"/>
  <text x="56" y="130" font-size="11" font-weight="700" fill="#8C8576" letter-spacing="1px">RUNTIME &#183; customer-facing</text>
  <rect x="44" y="568" width="1035" height="92" rx="6" fill="#F3F1EB" stroke="#E4E0D6"/>
  <text x="56" y="586" font-size="11" font-weight="700" fill="#8C8576" letter-spacing="1px">OPERATIONS &#183; internal</text>
  <rect x="44" y="672" width="1035" height="84" rx="6" fill="#EEECE4" stroke="#E4E0D6"/>
  <text x="56" y="690" font-size="11" font-weight="700" fill="#8C8576" letter-spacing="1px">DELIVERY &#183; build-time, not customer runtime</text>

  <!-- channels -->
  <rect x="58" y="172" width="110" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="113" y="192" text-anchor="middle" font-size="10">Portal / App</text>
  <rect x="58" y="214" width="110" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="113" y="234" text-anchor="middle" font-size="10">Web chat</text>
  <rect x="58" y="256" width="110" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="113" y="276" text-anchor="middle" font-size="10">Voice / CTI</text>
  <rect x="58" y="320" width="110" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="113" y="340" text-anchor="middle" font-size="10">Identity (SSO)</text>
  <line x1="113" y1="320" x2="113" y2="288" stroke="#1C1C1A" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="120" y="306" font-size="8" fill="#6B6960">auth</text>

  <!-- channels to core -->
  <line x1="168" y1="188" x2="212" y2="220" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>
  <line x1="168" y1="230" x2="212" y2="240" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>
  <line x1="168" y1="272" x2="212" y2="262" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>

  <!-- core -->
  <rect x="214" y="178" width="150" height="152" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.8"/>
  <text x="289" y="246" text-anchor="middle" font-size="11" font-weight="700">Salesforce</text>
  <text x="289" y="262" text-anchor="middle" font-size="11" font-weight="700">Automotive Cloud</text>
  <text x="289" y="280" text-anchor="middle" font-size="9" fill="#6B6960">(Sales + Service)</text>

  <!-- agent + assist -->
  <rect x="400" y="194" width="148" height="80" rx="9" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6"/>
  <text x="538" y="212" font-size="15" font-weight="700" fill="#1E55C0">~</text>
  <text x="474" y="238" text-anchor="middle" font-size="12">Agentforce</text>
  <text x="474" y="254" text-anchor="middle" font-size="12">Agent</text>
  <rect x="214" y="346" width="184" height="36" rx="9" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6"/>
  <text x="306" y="369" text-anchor="middle" font-size="11" fill="#1E55C0">Agent-Assist (advisor)</text>

  <!-- core <-> agent -->
  <line x1="364" y1="226" x2="398" y2="226" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#aopen)"/>
  <text x="381" y="220" text-anchor="middle" font-size="8" fill="#1E55C0">invoke</text>
  <line x1="398" y1="244" x2="364" y2="244" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>

  <!-- trust boundary -->
  <text x="682" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#1E55C0">TRUST BOUNDARY</text>
  <rect x="590" y="180" width="184" height="182" rx="8" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="600" y="200" font-size="9" fill="#1E55C0">mask</text>
  <text x="600" y="352" font-size="9" fill="#1E55C0">log</text>
  <rect x="606" y="212" width="152" height="40" rx="6" fill="#FFFFFF" stroke="#1E55C0" stroke-width="1.5"/><text x="682" y="237" text-anchor="middle" font-size="11" fill="#1E55C0">Model Gateway</text>
  <rect x="606" y="296" width="152" height="46" rx="6" fill="#FFFFFF" stroke="#1E55C0" stroke-width="1.5"/><text x="682" y="318" text-anchor="middle" font-size="11" fill="#1E55C0">External models</text><text x="682" y="332" text-anchor="middle" font-size="8" fill="#6B6960">zero-retain</text>
  <line x1="682" y1="252" x2="682" y2="294" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#aacc)"/>

  <!-- agent to gateway -->
  <line x1="548" y1="226" x2="604" y2="226" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#aopen)"/>
  <line x1="604" y1="240" x2="550" y2="240" stroke="#1E55C0" stroke-width="1.4" marker-end="url(#aacc)"/>

  <!-- grounding -->
  <path d="M420 432 v30 a50 8 0 0 0 100 0 v-30" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/>
  <ellipse cx="470" cy="432" rx="50" ry="8" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/>
  <text x="470" y="452" text-anchor="middle" font-size="10">Data Cloud</text>
  <rect x="540" y="418" width="76" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="578" y="438" text-anchor="middle" font-size="10">retrieve</text>
  <line x1="520" y1="434" x2="538" y2="434" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>
  <line x1="578" y1="418" x2="500" y2="276" stroke="#1E55C0" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#agr)"/>
  <text x="556" y="350" font-size="9" fill="#1E55C0">grounds</text>

  <!-- telematics -->
  <rect x="58" y="418" width="110" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="113" y="438" text-anchor="middle" font-size="10">Telematics</text>
  <line x1="168" y1="434" x2="418" y2="434" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>
  <text x="250" y="428" font-size="8" fill="#6B6960">feeds</text>
  <text x="113" y="466" text-anchor="middle" font-size="8" fill="#1E55C0">also triggers proactive outreach</text>

  <!-- actions bus -->
  <path d="M474 274 V392 H816" fill="none" stroke="#1E55C0" stroke-width="2" marker-end="url(#aacc)"/>
  <text x="620" y="386" text-anchor="middle" font-size="9" fill="#1E55C0">actions: validated &amp; logged</text>
  <rect x="820" y="376" width="120" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="880" y="396" text-anchor="middle" font-size="10">DMS</text>
  <rect x="820" y="418" width="120" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="880" y="438" text-anchor="middle" font-size="10">Scheduling</text>
  <rect x="820" y="460" width="120" height="32" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="880" y="480" text-anchor="middle" font-size="10">ERP (SAP)</text>
  <line x1="816" y1="392" x2="818" y2="392" stroke="#1E55C0" stroke-width="2"/>
  <line x1="780" y1="392" x2="780" y2="434" stroke="#1E55C0" stroke-width="1.4" marker-end="url(#aacc)"/>
  <line x1="780" y1="434" x2="818" y2="434" stroke="#1E55C0" stroke-width="1.4" marker-end="url(#aacc)"/>
  <line x1="800" y1="392" x2="800" y2="476" stroke="#1E55C0" stroke-width="1.4"/>
  <line x1="800" y1="476" x2="818" y2="476" stroke="#1E55C0" stroke-width="1.4" marker-end="url(#aacc)"/>

  <!-- operations -->
  <rect x="400" y="600" width="230" height="44" rx="6" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.5"/><text x="515" y="627" text-anchor="middle" font-size="11" fill="#1E55C0">Observability &amp; Evaluation</text>
  <line x1="460" y1="600" x2="350" y2="382" stroke="#1E55C0" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#agr)"/>
  <line x1="600" y1="600" x2="660" y2="362" stroke="#1E55C0" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#agr)"/>
  <text x="540" y="596" text-anchor="middle" font-size="8" fill="#1E55C0">observes the runtime</text>
  <rect x="680" y="600" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#B9B4A6" stroke-width="1.3" stroke-dasharray="4 3"/><text x="780" y="627" text-anchor="middle" font-size="10" fill="#8C8576">Internal co-worker</text>

  <!-- delivery -->
  <rect x="400" y="702" width="280" height="40" rx="6" fill="#FFFFFF" stroke="#B9B4A6" stroke-width="1.3" stroke-dasharray="4 3"/><text x="540" y="722" text-anchor="middle" font-size="10" fill="#8C8576">AI-assisted delivery (Claude Code)</text><text x="540" y="735" text-anchor="middle" font-size="8" fill="#8C8576">deliberately out of the customer runtime</text>

  <text x="44" y="780" font-size="10" font-style="italic" fill="#9A958A">Drawing the Unseen &#183; MMG &#183; solution architecture</text>
</svg>
