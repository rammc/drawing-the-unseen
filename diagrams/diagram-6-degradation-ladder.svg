<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','IBM Plex Mono','DejaVu Sans Mono',monospace">
  <defs>
    <marker id="amb" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#C2871A"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="#F6F4EE"/>

  <text x="44" y="60" font-size="24" font-weight="700" fill="#1C1C1A">Degradation Ladder</text>
  <text x="46" y="84" font-size="12" fill="#6B6960">what happens when the AI path fails or stalls &#183; the fallback the kit can't draw (gap D5)</text>

  <rect x="838" y="34" width="13" height="13" rx="3" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.5"/><text x="857" y="44" font-size="9" fill="#1E55C0">model path</text>
  <rect x="838" y="52" width="13" height="13" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/><text x="857" y="62" font-size="9" fill="#1C1C1A">deterministic / human</text>
  <rect x="838" y="70" width="13" height="13" rx="3" fill="#F6ECD6" stroke="#C2871A" stroke-width="1.5"/><text x="857" y="80" font-size="9" fill="#9A6A14">safety net</text>

  <line x1="44" y1="100" x2="956" y2="100" stroke="#D9D5CB" stroke-width="1"/>

  <text x="60" y="156" font-size="10" font-weight="700" fill="#1E55C0">PRIMARY</text>
  <text x="60" y="676" font-size="10" font-weight="700" fill="#9A6A14">LAST RESORT</text>

  <!-- rung 1 -->
  <rect x="200" y="140" width="380" height="48" rx="8" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6"/>
  <text x="390" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1E55C0">Primary path</text>
  <text x="390" y="178" text-anchor="middle" font-size="9" fill="#6B6960">grounded agent + deep model</text>
  <text x="620" y="168" font-size="10" fill="#6B6960">customer gets: normal grounded answer</text>

  <line x1="390" y1="188" x2="390" y2="236" stroke="#C2871A" stroke-width="1.6" marker-end="url(#amb)"/>
  <text x="402" y="216" font-size="9" fill="#9A6A14">timeout / transient error</text>

  <!-- rung 2 -->
  <rect x="200" y="240" width="380" height="48" rx="8" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6"/>
  <text x="390" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1E55C0">Retry</text>
  <text x="390" y="278" text-anchor="middle" font-size="9" fill="#6B6960">once, with backoff</text>
  <text x="620" y="268" font-size="10" fill="#6B6960">customer gets: same answer, a bit slower</text>

  <line x1="390" y1="288" x2="390" y2="336" stroke="#C2871A" stroke-width="1.6" marker-end="url(#amb)"/>
  <text x="402" y="316" font-size="9" fill="#9A6A14">still failing or too slow</text>

  <!-- rung 3 -->
  <rect x="200" y="340" width="380" height="48" rx="8" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6"/>
  <text x="390" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#1E55C0">Cheaper, faster model</text>
  <text x="390" y="378" text-anchor="middle" font-size="9" fill="#6B6960">degraded but available</text>
  <text x="620" y="368" font-size="10" fill="#6B6960">customer gets: shorter answer, still grounded</text>

  <line x1="390" y1="388" x2="390" y2="436" stroke="#C2871A" stroke-width="1.6" marker-end="url(#amb)"/>
  <text x="402" y="416" font-size="9" fill="#9A6A14">model / gateway down</text>

  <!-- rung 4 -->
  <rect x="200" y="440" width="380" height="48" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.6"/>
  <text x="390" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#1C1C1A">Deterministic fallback</text>
  <text x="390" y="478" text-anchor="middle" font-size="9" fill="#6B6960">cached answer &#183; KB article &#183; scripted flow</text>
  <text x="620" y="468" font-size="10" fill="#6B6960">customer gets: verified static answer, no model</text>
  <line x1="196" y1="464" x2="120" y2="464" stroke="#C2871A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#amb)"/>
  <text x="60" y="450" font-size="8" fill="#9A6A14">low confidence</text>
  <text x="60" y="461" font-size="8" fill="#9A6A14">(see sequence)</text>

  <line x1="390" y1="488" x2="390" y2="536" stroke="#C2871A" stroke-width="1.6" marker-end="url(#amb)"/>
  <text x="402" y="516" font-size="9" fill="#9A6A14">no deterministic match</text>

  <!-- rung 5 -->
  <rect x="200" y="540" width="380" height="48" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.6"/>
  <text x="390" y="562" text-anchor="middle" font-size="12" font-weight="700" fill="#1C1C1A">Human handoff</text>
  <text x="390" y="578" text-anchor="middle" font-size="9" fill="#6B6960">advisor, with full context</text>
  <text x="620" y="568" font-size="10" fill="#6B6960">customer gets: advisor takes over</text>

  <line x1="390" y1="588" x2="390" y2="636" stroke="#C2871A" stroke-width="1.6" marker-end="url(#amb)"/>
  <text x="402" y="616" font-size="9" fill="#9A6A14">after hours / queue full</text>

  <!-- rung 6 -->
  <rect x="200" y="640" width="380" height="48" rx="8" fill="#F6ECD6" stroke="#C2871A" stroke-width="1.8"/>
  <text x="390" y="662" text-anchor="middle" font-size="12" font-weight="700" fill="#9A6A14">Graceful defer</text>
  <text x="390" y="678" text-anchor="middle" font-size="9" fill="#9A6A14">ticket + callback, honest message</text>
  <text x="620" y="668" font-size="10" fill="#6B6960">customer gets: "we'll come back", no dead end</text>

  <text x="44" y="726" font-size="11" font-weight="700" fill="#1C1C1A">Every rung degrades capability, never safety.</text>
  <text x="44" y="744" font-size="11" fill="#6B6960">No rung is a blank failure, and no rung is a guessed answer. That invariant is what the kit could not express.</text>
  <text x="44" y="770" font-size="10" font-style="italic" fill="#9A958A">Drawing the Unseen &#183; MMG &#183; degradation ladder</text>
</svg>
