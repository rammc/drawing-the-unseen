<svg viewBox="0 0 1240 650" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','IBM Plex Mono','DejaVu Sans Mono',monospace">
  <defs>
    <marker id="acc" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1E55C0"/></marker>
    <marker id="ga" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#1E55C0"/></marker>
    <marker id="aloop" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L5 3 L0 6 z" fill="#1E55C0"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="650" fill="#F6F4EE"/>

  <text x="44" y="60" font-size="24" font-weight="700" fill="#1C1C1A">The Magic Box, and the Honest Version</text>
  <text x="46" y="84" font-size="12" fill="#6B6960">the same system drawn two ways &#183; why vague notation fails the board</text>
  <line x1="44" y1="100" x2="1196" y2="100" stroke="#D9D5CB" stroke-width="1"/>

  <!-- divider -->
  <line x1="618" y1="116" x2="618" y2="592" stroke="#D9D5CB" stroke-width="1"/>
  <circle cx="618" cy="330" r="16" fill="#F6F4EE" stroke="#B9B4A6" stroke-width="1"/>
  <text x="618" y="335" text-anchor="middle" font-size="11" fill="#8C8576">vs</text>

  <!-- ===== LEFT : BEFORE ===== -->
  <text x="44" y="130" font-size="14" font-weight="700" fill="#8C8576">BEFORE &#183; the magic box</text>

  <!-- surrounding systems -->
  <g font-size="9" fill="#1C1C1A">
    <rect x="250" y="150" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="300" y="168" text-anchor="middle">Customers</text>
    <rect x="90" y="196" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="140" y="214" text-anchor="middle">Customer data</text>
    <rect x="60" y="316" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="110" y="334" text-anchor="middle">Telematics</text>
    <rect x="90" y="436" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="140" y="454" text-anchor="middle">Marketing</text>
    <rect x="250" y="486" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="300" y="504" text-anchor="middle">Payments</text>
    <rect x="420" y="436" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="470" y="454" text-anchor="middle">ERP</text>
    <rect x="450" y="316" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="500" y="334" text-anchor="middle">DMS</text>
    <rect x="420" y="196" width="100" height="28" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2"/><text x="470" y="214" text-anchor="middle">Models</text>
  </g>

  <!-- undifferentiated lines -->
  <g stroke="#9A958A" stroke-width="1">
    <line x1="300" y1="330" x2="300" y2="178"/>
    <line x1="300" y1="330" x2="140" y2="224"/>
    <line x1="300" y1="330" x2="160" y2="330"/>
    <line x1="300" y1="330" x2="140" y2="436"/>
    <line x1="300" y1="330" x2="300" y2="486"/>
    <line x1="300" y1="330" x2="470" y2="464"/>
    <line x1="300" y1="330" x2="450" y2="330"/>
    <line x1="300" y1="330" x2="470" y2="224"/>
  </g>

  <!-- blob -->
  <ellipse cx="300" cy="330" rx="105" ry="72" fill="#EDEAE2" stroke="#B9B4A6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="300" y="306" text-anchor="middle" font-size="34" font-weight="700" fill="#8C8576">AI</text>
  <text x="300" y="328" text-anchor="middle" font-size="10" fill="#8C8576">does everything</text>
  <text x="300" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#9A6A14">data?   authority?</text>
  <text x="300" y="368" text-anchor="middle" font-size="10" font-weight="700" fill="#9A6A14">failure?   cost?</text>

  <rect x="44" y="556" width="556" height="32" fill="#3A3833"/>
  <text x="322" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">The board cannot sign this off</text>

  <!-- ===== RIGHT : AFTER ===== -->
  <text x="640" y="130" font-size="14" font-weight="700" fill="#1E55C0">AFTER &#183; honest notation</text>

  <rect x="648" y="216" width="78" height="34" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.3"/><text x="687" y="237" text-anchor="middle" font-size="9">channels</text>
  <rect x="748" y="216" width="70" height="34" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.3"/><text x="783" y="237" text-anchor="middle" font-size="9">core</text>
  <rect x="840" y="210" width="88" height="46" rx="8" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.5"/><text x="878" y="240" text-anchor="middle" font-size="10" fill="#1E55C0">agent</text><text x="912" y="226" font-size="13" font-weight="700" fill="#1E55C0">~</text>
  <text x="961" y="200" text-anchor="middle" font-size="8" fill="#1E55C0">mask</text>
  <rect x="944" y="206" width="34" height="54" rx="4" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="994" y="210" width="92" height="46" rx="8" fill="#FFFFFF" stroke="#1E55C0" stroke-width="1.5"/><text x="1040" y="238" text-anchor="middle" font-size="10" fill="#1E55C0">model</text>

  <line x1="726" y1="233" x2="746" y2="233" stroke="#1C1C1A" stroke-width="1.3" marker-end="url(#acc)"/>
  <line x1="818" y1="233" x2="838" y2="233" stroke="#1C1C1A" stroke-width="1.3" marker-end="url(#acc)"/>
  <line x1="928" y1="233" x2="942" y2="233" stroke="#1E55C0" stroke-width="1.4" marker-end="url(#acc)"/>
  <line x1="978" y1="233" x2="992" y2="233" stroke="#1E55C0" stroke-width="1.4" marker-end="url(#acc)"/>

  <!-- grounding -->
  <path d="M842 332 v20 a42 6 0 0 0 84 0 v-20" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.3"/>
  <ellipse cx="884" cy="332" rx="42" ry="6" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.3"/>
  <text x="884" y="348" text-anchor="middle" font-size="9">Data Cloud</text>
  <line x1="884" y1="326" x2="884" y2="258" stroke="#1E55C0" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ga)"/>
  <text x="894" y="296" font-size="8" fill="#1E55C0">grounds</text>

  <!-- observability -->
  <rect x="760" y="404" width="326" height="30" rx="6" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.4"/><text x="923" y="423" text-anchor="middle" font-size="10" fill="#1E55C0">observability &amp; evaluation</text>
  <line x1="884" y1="404" x2="884" y2="372" stroke="#1E55C0" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#ga)"/>

  <!-- four questions placed -->
  <rect x="648" y="450" width="438" height="98" rx="6" fill="#FBFAF6" stroke="#D9D5CB" stroke-width="1"/>
  <text x="662" y="470" font-size="10" font-weight="700" fill="#1C1C1A">the same four questions, now each with a home</text>
  <text x="662" y="490" font-size="10" fill="#1E55C0">data &#8594; masked at the trust boundary</text>
  <text x="662" y="508" font-size="10" fill="#9A6A14">authority &#8594; the authority map</text>
  <text x="662" y="526" font-size="10" fill="#9A6A14">failure &#8594; the degradation ladder</text>
  <text x="662" y="544" font-size="10" fill="#9A6A14">cost &#8594; tiered models + staged rollout</text>

  <rect x="640" y="556" width="556" height="32" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.4"/>
  <text x="918" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#1E55C0">Reviewable: every risk has a home</text>

  <text x="44" y="628" font-size="10" font-style="italic" fill="#9A958A">Drawing the Unseen &#183; MMG &#183; magic box vs honest notation</text>
</svg>
