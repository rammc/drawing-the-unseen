<svg viewBox="0 0 1123 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','IBM Plex Mono','DejaVu Sans Mono',monospace">
  <defs>
    <marker id="aink" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1C1C1A"/></marker>
    <marker id="aacc" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1E55C0"/></marker>
    <marker id="aopen" markerWidth="11" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1E55C0" stroke-width="1.4"/></marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#1E55C0"/></marker>
    <marker id="amb" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#C2871A"/></marker>
  </defs>

  <rect x="0" y="0" width="1123" height="600" fill="#F6F4EE"/>

  <text x="44" y="62" font-size="25" font-weight="700" fill="#1C1C1A">MMG AI Data Flow</text>
  <text x="46" y="86" font-size="12" fill="#6B6960">what happens to customer data the instant it touches a model &#183; Marcus's view</text>

  <rect x="916" y="34" width="13" height="13" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/><text x="935" y="44" font-size="9" fill="#1C1C1A">existing</text>
  <rect x="916" y="52" width="13" height="13" rx="3" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.5"/><text x="935" y="62" font-size="9" fill="#1E55C0">AI-specific</text>
  <rect x="916" y="70" width="13" height="13" rx="3" fill="#F6ECD6" stroke="#C2871A" stroke-width="1.5"/><text x="935" y="80" font-size="9" fill="#9A6A14">beyond kit v0.1</text>

  <line x1="44" y1="100" x2="1079" y2="100" stroke="#D9D5CB" stroke-width="1"/>

  <!-- human in loop -->
  <rect x="470" y="128" width="210" height="46" rx="6" fill="#F6ECD6" stroke="#C2871A" stroke-width="1.6"/>
  <text x="575" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#9A6A14">Human approves</text>
  <text x="575" y="164" text-anchor="middle" font-size="9" fill="#9A6A14">high-stakes: safety / recall</text>

  <!-- customer in -->
  <rect x="44" y="300" width="84" height="44" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/><text x="86" y="326" text-anchor="middle" font-size="10">Customer</text>
  <line x1="128" y1="322" x2="170" y2="322" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#aink)"/>
  <rect x="136" y="306" width="28" height="13" rx="2" fill="#F6ECD6" stroke="#C2871A" stroke-width="1"/><text x="150" y="316" text-anchor="middle" font-size="8" fill="#9A6A14">PII</text>
  <rect x="172" y="302" width="70" height="40" rx="4" fill="#F6ECD6" stroke="#C2871A" stroke-width="1.5"/><text x="207" y="326" text-anchor="middle" font-size="9" fill="#9A6A14">AI notice</text>
  <line x1="242" y1="322" x2="276" y2="322" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#aink)"/>

  <!-- trust boundary IN -->
  <text x="306" y="204" text-anchor="middle" font-size="9" fill="#1E55C0">mask PII</text>
  <rect x="278" y="210" width="56" height="224" rx="6" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="306" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#1E55C0" transform="rotate(-90 306 322)">TRUST BOUNDARY</text>

  <!-- protected zone -->
  <rect x="350" y="210" width="492" height="224" rx="6" fill="none" stroke="#1E55C0" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="358" y="226" font-size="8" fill="#1E55C0">protected zone (masked)</text>

  <rect x="372" y="296" width="118" height="58" rx="9" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6"/>
  <text x="431" y="330" text-anchor="middle" font-size="12" fill="#1E55C0">agent</text>
  <text x="482" y="310" font-size="15" font-weight="700" fill="#1E55C0">~</text>
  <path d="M470 290 a8 8 0 1 1 -5 -5" fill="none" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#agr)"/>

  <rect x="540" y="300" width="104" height="46" rx="6" fill="#FFFFFF" stroke="#1E55C0" stroke-width="1.5"/><text x="592" y="327" text-anchor="middle" font-size="11" fill="#1E55C0">Model Gateway</text>
  <rect x="678" y="298" width="148" height="50" rx="6" fill="#FFFFFF" stroke="#1E55C0" stroke-width="1.5"/><text x="752" y="320" text-anchor="middle" font-size="11" fill="#1E55C0">external model</text><text x="752" y="335" text-anchor="middle" font-size="8" fill="#6B6960">zero-retain</text>

  <line x1="490" y1="324" x2="538" y2="324" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#aopen)"/>
  <line x1="644" y1="324" x2="676" y2="324" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#aacc)"/>

  <!-- grounding -->
  <path d="M384 480 v22 a48 7 0 0 0 96 0 v-22" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/>
  <ellipse cx="432" cy="480" rx="48" ry="7" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/>
  <text x="432" y="495" text-anchor="middle" font-size="10">Data Cloud</text>
  <rect x="500" y="464" width="72" height="30" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/><text x="536" y="484" text-anchor="middle" font-size="10">retrieve</text>
  <line x1="480" y1="480" x2="498" y2="480" stroke="#1C1C1A" stroke-width="1.4" marker-end="url(#aink)"/>
  <line x1="536" y1="464" x2="436" y2="356" stroke="#1E55C0" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#agr)"/>
  <text x="455" y="430" font-size="9" fill="#1E55C0">grounds</text>
  <rect x="585" y="470" width="118" height="14" rx="2" fill="#F6ECD6" stroke="#C2871A" stroke-width="1"/><text x="644" y="481" text-anchor="middle" font-size="8" fill="#9A6A14">scoped &#183; non-PII</text>

  <!-- trust boundary OUT -->
  <text x="880" y="204" text-anchor="middle" font-size="9" fill="#1E55C0">score &#183; log</text>
  <rect x="852" y="210" width="56" height="224" rx="6" fill="#EEF3FC" stroke="#1E55C0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="880" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#1E55C0" transform="rotate(-90 880 322)">TRUST BOUNDARY</text>

  <!-- to customer -->
  <line x1="826" y1="322" x2="850" y2="322" stroke="#1E55C0" stroke-width="1.5" marker-end="url(#aacc)"/>
  <line x1="908" y1="322" x2="946" y2="322" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#aink)"/>
  <rect x="950" y="300" width="92" height="44" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5"/><text x="996" y="326" text-anchor="middle" font-size="10">to customer</text>

  <!-- escalate / approve -->
  <line x1="450" y1="296" x2="500" y2="176" stroke="#C2871A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#amb)"/>
  <text x="446" y="244" font-size="9" fill="#9A6A14">escalate</text>
  <line x1="640" y1="176" x2="470" y2="294" stroke="#C2871A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#amb)"/>
  <text x="600" y="232" font-size="9" fill="#9A6A14">approved</text>

  <!-- audit log -->
  <path d="M952 470 v22 a40 7 0 0 0 80 0 v-22" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/>
  <ellipse cx="992" cy="470" rx="40" ry="7" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.4"/>
  <text x="992" y="485" text-anchor="middle" font-size="9">audit log</text>
  <text x="992" y="512" text-anchor="middle" font-size="8" fill="#6B6960">non-PII &#183; decisions</text>
  <line x1="880" y1="434" x2="970" y2="462" stroke="#1E55C0" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#agr)"/>

  <text x="44" y="560" font-size="10" font-style="italic" fill="#9A958A">Drawing the Unseen &#183; MMG &#183; AI data flow</text>
</svg>
